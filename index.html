<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Arcane vs. Steel — 2D Physics Auto-Battler</title>
  <meta name="description" content="TABS-inspired 2D physics auto-battler featuring procedural animations, dynamic lighting, floor reflections, and cinematic ultimates." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="arena-canvas"></canvas>

    <!-- Top Fighting-Game Broadcast HUD -->
    <header class="hud-top">
      <!-- Warrior (Left) -->
      <section class="fighter-wing wing-left" id="hud-warrior">
        <div class="wing-meta">
          <div class="name-cluster">
            <span class="class-tag tag-steel">VANGUARD</span>
            <h2 class="fighter-name">Aethelgard</h2>
          </div>
          <span class="hp-readout" id="warrior-hp-text">1200</span>
        </div>

        <div class="hp-shell">
          <div class="hp-ghost" id="warrior-hp-dmg" style="width: 100%"></div>
          <div class="hp-fill fill-steel" id="warrior-hp-bar" style="width: 100%"></div>
        </div>

        <div class="resource-row">
          <div class="ult-shell" title="Ultimate: Heavenly Earthshatter">
            <div class="ult-fill fill-ult-steel" id="warrior-mana-bar" style="width: 0%"></div>
            <span class="ult-text" id="warrior-ult-label">ULT 0%</span>
          </div>
          <div class="skill-chip" id="warrior-cd-pill">
            <div class="skill-fill" id="warrior-skill-cd"></div>
            <span class="skill-label" id="warrior-skill-text">Whirlwind</span>
          </div>
        </div>
        <span class="sr-only" id="warrior-state">IDLE</span>
      </section>

      <!-- Center Emblem & Timer -->
      <div class="vs-emblem">
        <h1 class="sr-only">Arcane vs Steel</h1>
        <div class="vs-crest">VS</div>
        <div class="match-clock" id="match-timer">00:00</div>
      </div>

      <!-- Fire Mage (Right) -->
      <section class="fighter-wing wing-right" id="hud-mage">
        <div class="wing-meta">
          <span class="hp-readout" id="mage-hp-text">950</span>
          <div class="name-cluster">
            <h2 class="fighter-name">Ignis Sol</h2>
            <span class="class-tag tag-arcane">PYROMANCER</span>
          </div>
        </div>

        <div class="hp-shell">
          <div class="hp-ghost" id="mage-hp-dmg" style="width: 100%"></div>
          <div class="hp-fill fill-arcane" id="mage-hp-bar" style="width: 100%"></div>
        </div>

        <div class="resource-row">
          <div class="skill-chip" id="mage-cd-pill">
            <div class="skill-fill" id="mage-skill-cd"></div>
            <span class="skill-label" id="mage-skill-text">Flame Pillar</span>
          </div>
          <div class="ult-shell" title="Ultimate: Meteor Cataclysm">
            <div class="ult-fill fill-ult-arcane" id="mage-mana-bar" style="width: 0%"></div>
            <span class="ult-text" id="mage-ult-label">ULT 0%</span>
          </div>
        </div>
        <span class="sr-only" id="mage-state">IDLE</span>
      </section>
    </header>

    <!-- Ultimate Callout Banner -->
    <div id="ult-banner" class="ult-banner hidden">
      <div class="ult-line"></div>
      <div class="ult-subtitle" id="ult-caster">AETHELGARD</div>
      <div class="ult-title" id="ult-name">HEAVENLY EARTHSHATTER</div>
      <div class="ult-line"></div>
    </div>

    <!-- Bottom Thumb-Friendly Control Dock -->
    <footer class="hud-bottom">
      <div class="control-dock">
        <button id="btn-slowmo" class="dock-btn" type="button" aria-pressed="false">
          <span class="status-led"></span>
          <span>0.35x Slow-Mo</span>
        </button>
        <div class="dock-divider"></div>
        <button id="btn-reset" class="dock-btn dock-btn-accent" type="button">
          <span>Reset Match</span>
        </button>
      </div>
    </footer>

    <!-- Victory Overlay -->
    <div id="victory-overlay" class="victory-overlay hidden">
      <div class="victory-modal">
        <div class="victory-eyebrow">ARENA VERDICT</div>
        <h2 class="victory-winner" id="victory-winner">AETHELGARD TRIUMPHS</h2>
        <p class="victory-stats" id="victory-stats">Steel prevails over Arcane</p>
        <button id="btn-play-again" class="dock-btn dock-btn-accent victory-btn" type="button">
          Play New Match
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
